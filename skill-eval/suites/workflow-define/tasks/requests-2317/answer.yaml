# 과제 1 답변표. 출처: SWE-bench Verified psf__requests-2317 problem_statement (hints_text 제외)
# 종류: user(물어야 나옴, 회수율 대상) / accept / findable
# leak_patterns: 2014년 저장소에서 유도할 수 없는 것만 (requests 2.4.3, Python 2.6·3.4는 저장소에 있음)

persona: >-
  requests를 쓰는 OpenStack 클라이언트(python-neutronclient) 사용자. requests 내부 구현은 잘 모른다.
  이슈를 처음 올리는 사람처럼, 묻는 것에만 짧게 답한다.

replies:
  unknown: "잘 모르겠어요, 추천대로 해주세요."
  confirm: "네, 그렇게 가요."
  progress: "네, 계속해 주세요."
  findable: "그건 직접 확인해 주세요."
  accept: "네, 그렇게 해 주세요."
  next_step: "다음 단계는 나중에 따로 요청할게요. 여기까지만 해 주세요."

facts:
  - id: U1
    kind: user
    source: "problem_statement: Converts method from b'GET' to \"b'GET'\""
    content: method가 bytes(b'GET')로 들어오면 builtin_str(method)가 그것을 문자열 "b'GET'"으로 바꿔 버린다(더 이상 bytes가 아닌 글자 그대로의 문자열)
    say: method가 b'GET' 같은 bytes로 들어오면, builtin_str을 거치면서 "b'GET'"이라는 문자열이 돼요.
    trigger: 어떤 문제인지, 증상, 무엇이 무엇으로 바뀌는지, 입력값이 무엇인지 물을 때
    keywords: ["b['’]GET", '(bytes|바이트).{0,60}(method|메서드)|(method|메서드).{0,60}(bytes|바이트)']
  - id: U2
    kind: user
    source: "problem_statement: it gets a 404 Not Found response"
    content: requests가 "b'GET'"이라는 method로 요청을 보내 서버에서 404 Not Found를 받는다
    say: 그 method로 요청이 나가서 서버에서 404 Not Found가 와요.
    trigger: 어떤 오류나 응답이 오는지, 어떻게 실패하는지 물을 때
    keywords: ['404']
  - id: U3
    kind: user
    source: "problem_statement: python3.4, python-neutronclient (2.3.9), requests (2.4.3)"
    content: 사용 환경은 Python 3.4, python-neutronclient 2.3.9, requests 2.4.3
    say: Python 3.4에서 python-neutronclient 2.3.9와 requests 2.4.3을 쓰고 있어요.
    trigger: 환경, 버전, 어떤 프로그램에서 쓰는지 물을 때
    keywords: ['2\.3\.9']   # 3.4·2.4.3은 저장소에도 있어 사용자에게 들었다는 증거가 못 된다(2026-10-23)
    leak_patterns: ['2\.3\.9']
  - id: U4
    kind: user
    source: "problem_statement: neutronclient ... utils.safe_encode_list(args) ... converts all the values to binary string, including method"
    content: neutronclient가 utils.safe_encode_list(args)로 인자 전부를 bytes로 바꾸는데 method까지 bytes가 된다
    say: neutronclient가 utils.safe_encode_list(args)로 인자를 전부 bytes로 바꾸는데, 그때 method도 bytes가 돼요.
    trigger: 왜 method가 bytes인지, 누가 그렇게 넘기는지, 호출하는 쪽 코드가 무엇인지 물을 때
    # neutron은 U6 대답(neutronclient)에도 나와 뺐다(2026-10-23). 바꿔 말한 꼴: 호출하는 쪽이 인자를 전부 bytes로 바꾼다
    keywords: ['safe_encode_list', '(인자|인수|arguments?|args).{0,30}(전부|모두|모든|all).{0,30}(bytes|바이트|binary)|(전부|모두|모든|all)\s*(인자|인수|arguments?|args).{0,30}(bytes|바이트|binary)']
    leak_patterns: ['safe_encode_list']
  - id: U5
    kind: user
    source: "problem_statement: I tried in python2.6 and this bug doesn't exist there"
    content: Python 2.6에서는 이 문제가 없다. 2.6과 3.4의 차이 때문인 것 같다
    say: Python 2.6에서는 이 문제가 없었어요. 2.6과 3.4 사이 무언가가 달라서인 것 같아요.
    trigger: 다른 Python 버전에서도 생기는지, 재현 조건, Python 2 동작을 물을 때
    keywords: ['2\.6']
  - id: U6
    kind: user
    source: "problem_statement: not sure if this is a bug with neutronclient or ... requests ... Seems if requests handled the method value being a binary string, we wouldn't have any problem"
    content: neutronclient 버그인지 requests 버그인지는 모르지만, requests가 bytes method를 받아서 처리해 주면 문제가 없을 것 같다(requests 쪽에서 고치길 원함)
    say: neutronclient 문제인지 requests 문제인지는 잘 모르겠어요. 그래도 requests가 bytes method를 받아서 처리해 주면 문제가 없을 것 같아요.
    trigger: 어느 쪽을 고칠지, 무엇을 원하는지, 기대하는 동작, 성공 기준을 물을 때
    keywords: ['(bytes|바이트)\s*(method|메서드|값)?.{0,60}(받|허용|처리|지원|accept|handl|support)', '(받|허용|처리|지원|accept|handl|support).{0,60}(bytes|바이트)']

  - id: F1
    kind: findable
    source: "problem_statement: In requests/sessions.py is a command"
    content: 문제의 코드는 requests/sessions.py의 Session.request 안 `method = builtin_str(method)`이다
  - id: F2
    kind: findable
    content: requests/compat.py에서 Python 3의 builtin_str은 str이라 str(b'GET')이 "b'GET'"이 된다
  - id: F3
    kind: findable
    content: 저장소의 requests 버전은 2.4.3이고 setup.py는 Python 2.6, 2.7, 3.3, 3.4를 지원한다고 적혀 있다

out_of_scope: []
