# 과제 2 답변표. 직접 작성(AI 초안, 사용자 검토). 목표 수준 사실: 목적, 대상, 우선순위, 범위 밖
# 종류: user(물어야 나옴, 회수율 대상) / accept / findable
# 비공개 과제라 외웠을 위험이 없어 leak_patterns는 두지 않는다

persona: >-
  사내 데이터 팀 개발자. requests로 외부 API를 호출하는 야간 배치를 운영한다.
  requests 내부 구현은 잘 모르고, 묻는 것에만 짧게 답한다.

replies:
  unknown: "잘 모르겠어요, 추천대로 해주세요."
  confirm: "네, 그렇게 가요."
  progress: "네, 계속해 주세요."
  findable: "그건 직접 확인해 주세요."
  accept: "네, 그렇게 해 주세요."
  next_step: "다음 단계는 나중에 따로 요청할게요. 여기까지만 해 주세요."

facts:
  - id: U1
    kind: user
    content: 목적은 야간 배치 작업이 외부 API를 호출하다가 가끔 연결이 끊기거나 503을 받아 작업 전체가 실패하는 것을 막는 것
    say: 밤에 도는 배치 작업이 외부 API를 부르는데, 가끔 연결이 끊기거나 503이 와서 작업 전체가 실패해요. 그걸 막고 싶어요.
    trigger: 왜 필요한지, 어떤 상황에서 쓰는지, 무엇이 문제인지 물을 때
    keywords: ['배치|batch', '야간|밤에|밤새|nightly']
  - id: U2
    kind: user
    content: 재시도 대상은 연결 오류, 읽기 시간 초과, HTTP 502·503·504. 4xx는 재시도하지 않는다
    say: 연결 오류랑 읽기 시간 초과, 그리고 502, 503, 504만 다시 시도하면 돼요. 4xx는 다시 보내면 안 돼요.
    trigger: 어떤 오류나 상태 코드에서 재시도할지 물을 때
    keywords: ['502|504', '(4xx|4\d\d).{0,40}(제외|않|안 |아니|no|not)']
  - id: U3
    kind: user
    content: GET, HEAD 같은 멱등 요청만 재시도한다. POST는 중복 처리(이중 결제 등) 위험이 있어 절대 재시도하지 않는다
    say: GET이나 HEAD 같은 요청만요. POST는 중복으로 처리될 수 있어서 절대 다시 보내면 안 돼요.
    trigger: 어떤 HTTP 메서드나 요청 종류에 적용할지 물을 때
    keywords: ['멱등|idempotent', 'POST.{0,60}(제외|않|안 |금지|never|no|not)']
  - id: U4
    kind: user
    content: 최대 3번 재시도하고, 간격은 지수적으로 늘린다(예 0.5초, 1초, 2초)
    say: 최대 3번이면 충분하고, 간격은 점점 늘어나게 해 주세요. 0.5초, 1초, 2초 이런 식으로요.
    trigger: 몇 번 재시도할지, 대기 간격, 백오프를 물을 때
    keywords: ['(최대|max(imum)?|up to)\s*3|3\s*(번|회|times|retries)', '지수|exponential|백오프|backoff']
  - id: U5
    kind: user
    content: 기존 코드의 동작이 바뀌면 안 된다. 기본값은 재시도 없음이고, 켜는 사람만 쓴다(opt-in). 이것이 가장 중요한 우선순위
    say: 제일 중요한 건 기존 코드 동작이 바뀌지 않는 거예요. 기본은 지금처럼 재시도 없이 두고, 원하는 사람만 켜서 쓰게 해 주세요.
    trigger: 기본 동작, 기존 사용자 영향, 호환성, 우선순위를 물을 때
    keywords: ['opt-?in|옵트인', '기본(값|\s*동작|은|으로).{0,40}(없|않|그대로|유지|off)|하위\s*호환|backward',
               # 2026-10-23 추가: "명시적으로 켠 경우에만", "기존 동작을 바꾸지 않는다"
               '명시적으로\s*(켠|켜|활성|호출|설정)|explicit(ly)?\s*(enabl|opt)|기존\s*(\S+\s*)?동작을?\s*(바꾸지|변경하지|유지)|(미설정|미호출|켜지\s*않).{0,30}기존\s*동작']
  - id: U6
    kind: user
    content: 세션(Session) 단위로 한 번 설정하면 그 세션의 모든 요청에 적용되면 좋겠다
    say: Session에서 한 번 설정하면 그 세션 요청 전체에 적용되면 좋겠어요.
    trigger: 어디서 어떻게 켜고 설정하는지, API 모양을 물을 때
    keywords: ['(Session|세션).{0,40}(단위|한 번|전체|모든|all)']

  - id: A1
    kind: accept
    content: 새 외부 의존성을 추가하지 않는다(requests에 들어 있는 urllib3를 쓴다)
    trigger: 새 라이브러리나 의존성을 써도 되는지 물을 때
  - id: A2
    kind: accept
    content: 테스트는 기존 테스트 파일에 네트워크 없이 도는 테스트로 추가한다
    trigger: 테스트를 어떻게 할지 물을 때
  - id: A3
    kind: accept
    content: 사용 예를 문서에 한 단락 추가한다
    trigger: 문서를 고칠지 물을 때

  - id: F1
    kind: findable
    content: requests에는 이미 HTTPAdapter(max_retries=n)가 있고 urllib3 Retry를 쓰지만, 연결 재시도만 하고(read=False) 상태 코드 재시도와 백오프는 없다
  - id: F2
    kind: findable
    content: Session.mount로 URL 앞부분별로 어댑터를 바꿔 끼울 수 있다
  - id: F3
    kind: findable
    content: 저장소의 requests 버전은 2.4.3이고 Python 2.6~3.4를 지원한다

out_of_scope:
  - id: O1
    kind: user
    content: 비동기 지원, 회로 차단기(circuit breaker), 재시도 로그·지표는 이번에 하지 않는다
    say: 비동기 지원이나 circuit breaker, 재시도 로그나 지표 같은 건 이번엔 안 해요.
    trigger: 범위 밖, 추가 기능, 로그나 모니터링, 비동기를 물을 때
    keywords: ['비동기|async', 'circuit|회로\s*차단', '(로그|지표|메트릭|metric).{0,30}(제외|않|안 |범위 밖|out of scope)|(제외|범위 밖|out of scope).{0,30}(로그|지표|메트릭|metric)']
