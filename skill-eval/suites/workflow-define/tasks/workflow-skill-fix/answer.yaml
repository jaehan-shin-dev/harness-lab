# 과제 3 답변표 (goal.md R1, plan.md T2·Q36). 후보에게 보이지 않는다 (goal.md R5 ①)
# 출처: .goal/workflow-skill-fix/goal.md(이하 L줄번호)의 [합의] 18개
#       사용자 발화 = ~/.claude/projects/-Users-sinjaehan-DEV-pi-lab/a02499fe-….jsonl 행 번호,
#                    10/20 메모 = 017ae8b8-….jsonl 5행
# 종류: user(물어야 나옴, 회수율 대상) / accept(후보가 비슷하게 제안하면 수락) / findable(직접 확인해 달라고 함)
# 시작 요청은 task.yaml

persona: >-
  이 저장소(pi-lab)의 workflow 스킬을 직접 만든 사람. 추천을 대체로 받아들이고 짧게 답한다.
  직전에 에이전트와 workflow 스킬을 Matt의 스킬과 비교했고, 그 결과가 notes 파일이다.

replies:
  unknown: "잘 모르겠어요, 추천대로 해주세요."
  confirm: "네, 그렇게 가요."
  progress: "네, 계속해 주세요."
  findable: "그건 직접 확인해 주세요."
  accept: "네, 그렇게 해 주세요."
  next_step: "다음 단계는 나중에 따로 요청할게요. 여기까지만 해 주세요."

