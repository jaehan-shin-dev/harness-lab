# workflow-define 스킬 묶음 (goal.md Q3, Q7, Q17, Q22)
name: workflow-define
tasks:
  - requests-2317             # 과제 1: 작은 코드 수정 (SWE-bench Verified psf__requests-2317)
  - requests-retry            # 과제 2: 애매한 기능 요청 (ClarEval 형식, 직접 작성)
  - workflow-skill-fix        # 과제 3: 비코드 목표 (지난 목표)

arms:
  skill:                      # 스킬 팔: workflow 스킬 7개 + AGENTS.md
    skills: all               # pi-lab/.agents/skills 아래 전부를 설정 폴더 skills/로 복사
    agents_md: true           # pi-lab/AGENTS.md를 설정 폴더로 복사
    start_skill: workflow-define
    first_message: "/skill:workflow-define {request}"
  control:                    # 대조 팔: 스킬·AGENTS.md 없음 (--no-skills --no-context-files)
    skills: []
    agents_md: false
    first_message: "{request}\n\n질문해서 목표를 정리하고 goal.md로 적어줘"

# 과정 검사 (goal.md R3). 코드는 skilleval/graders/process.py
process_checks: [c1_goal_location, c2_six_sections, c3_numbered_recommended, c4_one_round_wait,
                 c5_goal_updated_each_round, c6_status_marks, c7_no_edit_outside_goal, c8_confirm_before_finish]
