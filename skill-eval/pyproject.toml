[project]
name = "skilleval"
version = "0.1.0"
description = "workflow 스킬을 pi로 돌려 과정과 결과를 재는 환경"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
skilleval = "skilleval.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skilleval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
