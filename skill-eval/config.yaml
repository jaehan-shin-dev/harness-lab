# 설정은 이 파일 한 곳에서 바꾼다 (goal.md C1)

# 후보·모의 사용자·심판 모두 같은 모델 (goal.md C1, Q18)
provider: openai-codex
model: gpt-6-sol
context_window: 272000        # 최대 컨텍스트 사용률 계산용 (goal.md R6)

thinking:                     # plan.md Q41
  candidate: medium
  mock_user: low
  judge: medium

reps: 3                       # 팔마다 반복 횟수 (goal.md R4)
max_rounds: 5                 # 모의 사용자 대답 상한 (goal.md R1)
jobs: 1                       # 동시 실행 회차 수 (plan.md Q40: M1·M2는 1, 18회는 재 보고 정함)

timeouts:                     # 초
  candidate_turn: 900
  mock_user: 180
  judge: 300

retries:                      # pi 호출 오류 시 재시도 횟수 (plan.md Q33)
  pi_call: 1
  json_parse: 1

auth:
  source: ~/.pi/agent/auth.json
  min_hours_left: 6           # 출입증 남은 시간이 이보다 적으면 실행을 멈춘다

candidate_tools: [read, bash, edit, write]   # plan.md Q42
