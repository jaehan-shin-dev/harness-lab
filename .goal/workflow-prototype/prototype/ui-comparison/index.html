<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 작업 · 세 가지 보기</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #252b27; background: #f4f3ed; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #28776b; outline-offset: 4px; }
    .shell { max-width: 1184px; padding: 46px 44px 60px; margin: auto; }
    .eyebrow { color: #587467; font-size: 11px; letter-spacing: .13em; font-weight: 700; }
    .header { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 30px; gap: 24px; }
    h1 { margin: 0 0 9px; font-size: 34px; letter-spacing: -.05em; }
    .intro { color: #6c736b; margin: 0; line-height: 1.6; font-size: 14px; }
    .date { color: #637266; border-left: 1px solid #c8cec3; padding-left: 18px; font-size: 13px; white-space: nowrap; }
    .date strong { display: block; margin-bottom: 4px; font-size: 21px; color: #2e4236; }
    .compare-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 28px; }
    .compare-tabs button { text-align: left; background: transparent; border: 1px solid #ccd2c7; border-radius: 12px; padding: 15px 18px; color: #70786e; }
    .compare-tabs button[aria-selected="true"] { background: #213e32; color: #fff; border-color: #213e32; }
    .compare-tabs strong { font-size: 15px; display: block; margin-bottom: 6px; }
    .compare-tabs span { font-size: 12px; opacity: .85; }
    .workspace { background: #fffefa; border: 1px solid #dfe3d9; border-radius: 18px; padding: 28px; min-height: 410px; box-shadow: 0 8px 24px #273c2e06; }
    .workspace-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 22px; }
    h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.035em; }
    .view-description { margin: 0; color: #70786c; font-size: 13px; }
    .count { font-size: 12px; color: #67725f; white-space: nowrap; }
    .filters { display: flex; align-items: center; border-bottom: 1px solid #e7e8de; padding-bottom: 20px; gap: 7px; margin-bottom: 20px; }
    .filters button { border: 0; border-radius: 100px; background: #f0f2e9; padding: 9px 14px; color: #697362; font-size: 12px; }
    .filters button[aria-pressed="true"] { background: #dce8d5; color: #2f523c; font-weight: 700; }
    .filters .helper { margin-left: auto; font-size: 12px; color: #7d8478; }
    .task { border: 1px solid #e1e5d9; background: #fffefa; text-align: left; color: inherit; border-radius: 12px; }
    .task:hover { border-color: #93ab87; background: #f9fbf4; }
    .task-title { display: block; font-size: 14px; font-weight: 650; line-height: 1.5; letter-spacing: -.02em; }
    .project { display: block; color: #7c8276; font-size: 11px; margin-top: 4px; }
    .badge { border-radius: 5px; padding: 4px 7px; font-size: 10px; white-space: nowrap; background: #e9eee1; color: #536745; }
    .badge.review { background: #f8ead2; color: #8e641e; }
    .badge.todo { background: #edf0ec; color: #6a7569; }
    .due { color: #6a7661; font-size: 11px; white-space: nowrap; }
    .avatar { width: 26px; height: 26px; border-radius: 50%; background: #e5eadd; color: #62705b; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
    .list-head, .list .task { display: grid; grid-template-columns: 1fr 86px 80px 34px; gap: 18px; align-items: center; }
    .list-head { padding: 0 16px 10px; color: #8a8e81; font-size: 10px; }
    .list { display: grid; gap: 7px; }
    .list .task { width: 100%; padding: 13px 16px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .cards .task { padding: 18px; min-height: 165px; display: flex; flex-direction: column; align-items: flex-start; }
    .cards .task-title { margin-top: 12px; }
    .task-footer { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: auto; padding-top: 18px; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .column { background: #f2f4ec; padding: 13px; border-radius: 12px; min-height: 300px; }
    .column-title { margin: 0 0 14px; color: #617056; font-size: 12px; display: flex; align-items: center; justify-content: space-between; }
    .column-title span { color: #849078; background: #e4e9dc; border-radius: 4px; padding: 2px 6px; font-size: 10px; }
    .board .task { width: 100%; padding: 14px; margin-bottom: 9px; }
    .board .task-footer { padding-top: 12px; }
    .empty { font-size: 12px; color: #87917e; padding: 18px 0; text-align: center; border: 1px dashed #d5ddcd; border-radius: 8px; }
    .observation { display: flex; gap: 20px; padding: 18px 4px; color: #7a8172; font-size: 12px; line-height: 1.7; }
    .observation strong { color: #4f6049; white-space: nowrap; font-weight: 600; }
    dialog { border: 1px solid #cdd6c5; border-radius: 18px; width: min(470px, calc(100% - 32px)); color: #293526; background: #fffefa; padding: 28px; box-shadow: 0 24px 80px #13230f40; }
    dialog::backdrop { background: #1c2c2450; }
    dialog h2 { margin: 16px 0 8px; font-size: 22px; line-height: 1.5; }
    dialog p { font-size: 14px; line-height: 1.9; color: #697260; }
    .detail-meta { display: flex; gap: 8px; align-items: center; margin: 22px 0; }
    .close-button { width: 100%; padding: 11px; border-radius: 8px; border: 0; background: #213e32; color: white; }
    @media (max-width: 700px) {
      .shell { padding: 26px 16px; }
      .header { align-items: flex-start; margin-bottom: 23px; }
      h1 { font-size: 28px; }
      .date { display: none; }
      .compare-tabs { gap: 6px; margin-bottom: 18px; }
      .compare-tabs button { padding: 12px 10px; }
      .compare-tabs strong { font-size: 12px; }
      .compare-tabs span { font-size: 10px; }
      .workspace { padding: 18px 14px; }
      .workspace-top { align-items: flex-start; }
      .view-description { line-height: 1.6; font-size: 12px; }
      .filters .helper { display: none; }
      .list-head { display: none; }
      .list .task { grid-template-columns: 1fr auto; gap: 8px; padding: 12px; }
      .list .due { grid-row: 2; }
      .list .avatar { grid-column: 2; grid-row: 2; justify-self: end; }
      .cards, .board { grid-template-columns: 1fr; }
      .cards .task { min-height: 145px; }
      .column { min-height: 110px; }
      .observation { gap: 12px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">A SMALL WORKSPACE STUDY / 01</div>
    <header class="header">
      <div><h1>오늘의 작업</h1><p class="intro">같은 다섯 가지 작업, 세 가지 보기.<br>검토할 일을 찾고 작업을 눌러 내용을 확인해 보세요.</p></div>
      <div class="date"><strong>10월 28일</strong>수요일 · 데모 데이터</div>
    </header>
    <nav class="compare-tabs" role="tablist" aria-label="보기 비교">
      <button role="tab" id="tab-list" aria-selected="true" aria-controls="task-panel" data-view="list"><strong>A · 목록</strong><span>한 줄에서 나란히</span></button>
      <button role="tab" id="tab-cards" aria-selected="false" aria-controls="task-panel" data-view="cards"><strong>B · 카드</strong><span>하나씩 둘러보기</span></button>
      <button role="tab" id="tab-board" aria-selected="false" aria-controls="task-panel" data-view="board"><strong>C · 상태 보드</strong><span>상태별로 모아 보기</span></button>
    </nav>
    <section id="task-panel" role="tabpanel" aria-labelledby="tab-list" class="workspace">
      <div class="workspace-top"><div><h2 id="view-title">작업 목록</h2><p class="view-description" id="view-description"></p></div><span class="count" role="status" id="task-count">5개 작업 표시</span></div>
      <div class="filters" role="group" aria-label="작업 필터">
        <button type="button" data-filter="all" aria-pressed="true">전체 5</button>
        <button type="button" data-filter="review" aria-pressed="false">검토 필요 2</button>
        <span class="helper">작업을 누르면 상세 내용이 열립니다</span>
      </div>
      <div id="tasks"></div>
    </section>
    <div class="observation"><strong>비교할 질문</strong><span>검토할 작업이 어디에 있고, 담당자와 마감은 어떻게 보이나요?<br>보기와 필터만 바뀌며, 실제 작업 데이터는 저장하지 않습니다.</span></div>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <span class="eyebrow">TASK DETAIL</span><h2 id="detail-title"></h2><span class="project" id="detail-project"></span>
    <p id="detail-description"></p><div class="detail-meta" id="detail-meta"></div><button type="button" class="close-button" id="detail-close">닫기</button>
  </dialog>
  <script>
    const tasks = [
      { id: 'copy', title: '랜딩 페이지 문구 검토', project: '웹사이트 리뉴얼', status: 'review', due: '오늘 14:00', owner: '서연', description: '첫 화면 제목과 가입 안내 문구를 읽고, 수정할 부분을 코멘트로 남겨 주세요.' },
      { id: 'flow', title: '온보딩 흐름 정리', project: '제품 경험', status: 'progress', due: '오늘 17:00', owner: '민수', description: '처음 가입한 사용자가 첫 작업을 만드는 흐름을 한 장으로 정리합니다.' },
      { id: 'report', title: '주간 리포트 확인', project: '팀 운영', status: 'review', due: '오늘 18:00', owner: '지우', description: '이번 주 진행 상황에서 누락된 결정과 다음 주 할 일을 확인해 주세요.' },
      { id: 'interview', title: '사용자 인터뷰 준비', project: '리서치', status: 'todo', due: '내일 11:00', owner: '서연', description: '사용자의 실제 작업 방식을 들을 수 있는 질문 세 개를 준비합니다.' },
      { id: 'tokens', title: '색상 토큰 정리', project: '디자인 시스템', status: 'progress', due: '내일 16:00', owner: '민수', description: '화면에서 반복해서 쓰는 배경과 텍스트 색상의 이름을 정리합니다.' }
    ];
    const statusLabels = { todo: '예정', progress: '진행 중', review: '검토 필요' };
    const views = {
      list: ['작업 목록', '작업·상태·마감·담당자를 같은 행에서 확인합니다.'],
      cards: ['작업 카드', '작업마다 같은 크기의 공간을 두어 내용을 살펴봅니다.'],
      board: ['상태별 작업', '예정 → 진행 중 → 검토 필요 순서로 작업을 묶습니다.']
    };
    let view = 'list';
    let filter = 'all';
    const taskRoot = document.querySelector('#tasks');
    const dialog = document.querySelector('#detail');
    function taskButton(task) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'task';
      button.setAttribute('aria-label', task.title + ' 상세 보기');
      const title = '<span><span class="task-title">' + task.title + '</span><span class="project">' + task.project + '</span></span>';
      const badge = '<span class="badge ' + task.status + '">' + statusLabels[task.status] + '</span>';
      const due = '<span class="due">' + task.due + '</span>';
      const avatar = '<span class="avatar" aria-label="담당 ' + task.owner + '">' + task.owner + '</span>';
      button.innerHTML = view === 'list' ? title + badge + due + avatar : (view === 'cards' ? badge : '') + title + '<span class="task-footer">' + due + avatar + '</span>';
      button.addEventListener('click', () => {
        document.querySelector('#detail-title').textContent = task.title;
        document.querySelector('#detail-project').textContent = task.project;
        document.querySelector('#detail-description').textContent = task.description;
        document.querySelector('#detail-meta').innerHTML = badge + due + avatar;
        dialog.showModal();
      });
      return button;
    }
    function render() {
      const visible = filter === 'review' ? tasks.filter(task => task.status === 'review') : tasks;
      taskRoot.replaceChildren();
      taskRoot.className = view;
      document.querySelector('#view-title').textContent = views[view][0];
      document.querySelector('#view-description').textContent = views[view][1];
      document.querySelector('#task-count').textContent = visible.length + '개 작업 표시';
      document.querySelector('#task-panel').setAttribute('aria-labelledby', 'tab-' + view);
      if (view === 'list') {
        const head = document.createElement('div');
        head.className = 'list-head';
        head.innerHTML = '<span>작업 / 프로젝트</span><span>상태</span><span>마감</span><span>담당</span>';
        taskRoot.append(head);
      }
      if (view === 'board') {
        for (const status of ['todo', 'progress', 'review']) {
          const column = document.createElement('section');
          column.className = 'column';
          column.setAttribute('aria-label', statusLabels[status]);
          const matching = visible.filter(task => task.status === status);
          column.innerHTML = '<h3 class="column-title">' + statusLabels[status] + '<span>' + matching.length + '</span></h3>';
          matching.forEach(task => column.append(taskButton(task)));
          if (!matching.length) column.insertAdjacentHTML('beforeend', '<div class="empty">표시할 작업 없음</div>');
          taskRoot.append(column);
        }
      } else visible.forEach(task => taskRoot.append(taskButton(task)));
    }
    document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
      view = button.dataset.view;
      document.querySelectorAll('[data-view]').forEach(tab => tab.setAttribute('aria-selected', String(tab === button)));
      render();
    }));
    document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
      filter = button.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      render();
    }));
    document.querySelector('#detail-close').addEventListener('click', () => dialog.close());
    render();
  </script>
</body>
</html>
